# Browser build of Pixeline. A separate workspace on purpose: the native CLI/GUI keep
# their own Cargo.lock and profile, so nothing here reaches `cargo run` builds.
[package]
name = "web-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
raster_to_pixel = { path = ".." }
# Exact pin: must match the wasm-bindgen CLI in install-tools.sh.
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm-pack would otherwise download binaryen; the output is small enough without it.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[workspace]
